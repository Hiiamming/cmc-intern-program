name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - feature/**
      - feat/**
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: Run Go Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify repo structure
        run: |
          pwd
          ls -la
          ls -la homeworks

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: homeworks/go.mod

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('homeworks/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: cd homeworks && go mod tidy

      - name: Run tests
        run: cd homeworks && go test -v ./...

      - name: Run coverage
        run: cd homeworks && go test -cover ./...

  gosec:
    name: Gosec Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: homeworks/go.mod

      - name: Run Gosec
        run: |
          cd homeworks
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          "$(go env GOPATH)/bin/gosec" ./...

  trivy:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: ./homeworks
          format: table
          exit-code: 0
          ignore-unfixed: true

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}