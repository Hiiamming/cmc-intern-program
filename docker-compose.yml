version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: mini-asm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: secops
      POSTGRES_PASSWORD: secops123
      POSTGRES_DB: mini_asm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./homeworks/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secops -d mini_asm"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./homeworks
      dockerfile: Dockerfile
    container_name: mini-asm-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: secops
      DB_PASSWORD: secops123
      DB_NAME: mini_asm
      DB_SSLMODE: disable
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./homeworks/frontend
      dockerfile: Dockerfile
    container_name: mini-asm-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  postgres_data: